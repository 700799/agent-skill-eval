name: Release

# Publishing is a one-way door: a version number can never be reused on PyPI,
# even after deletion. So every artifact is linted, type-checked, tested, and
# metadata-validated before upload, and a tag whose version disagrees with
# pyproject.toml fails the build instead of shipping the wrong number.
#
# Auth is PyPI Trusted Publishing (OIDC) — no API token is stored in this
# repository. Configure the publisher once per index at
# https://pypi.org/manage/account/publishing/ with:
#   owner/repository: 700799/agent-skill-eval
#   workflow name:    release.yml
#   environment:      pypi          (and testpypi on test.pypi.org)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project
        run: |
          uv python install 3.11
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          project=$(uv run python -c \
            "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $project / tag: $tag"
          if [ "$project" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $project"
            exit 1
          fi

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Validate metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'push' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
