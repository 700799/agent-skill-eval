name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # A uv-managed venv, not --system: the runner's system interpreter is
      # externally managed (PEP 668) and refuses the install outright.
      - name: Install project
        run: |
          uv python install 3.11
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src

      # Fully offline: replay fixtures stand in for the CLI, and live-marked
      # tests are deselected by default. No API key or network required.
      - name: Test
        run: uv run pytest -q
