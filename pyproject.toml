[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-skill-eval"
version = "0.1.0"
description = "Evaluation framework for Claude Code skills and pydev plugins: A/B benchmarking, token-waste detection, skill adherence, and portfolio ranking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agent-skill-eval contributors" }]
keywords = ["claude", "claude-code", "evaluation", "benchmark", "agent", "skills", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-PyYAML",
]

[project.scripts]
ase = "agent_skill_eval.cli:main"

[project.urls]
Repository = "https://github.com/700799/agent-skill-eval"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_skill_eval"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "anthropic.*"
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-m 'not live' -q"
markers = [
    "live: requires an authenticated claude CLI and spends real tokens",
]
testpaths = ["tests"]
