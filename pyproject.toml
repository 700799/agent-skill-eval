[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-eval-kit"
version = "0.1.0"
description = "Evaluation framework for Claude Code skills and pydev plugins: A/B benchmarking, token-waste detection, skill adherence, and portfolio ranking."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "skill-eval-kit contributors" }]
keywords = ["claude", "claude-code", "evaluation", "benchmark", "agent", "skills", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "types-PyYAML",
]

[project.scripts]
skill-eval = "skill_eval_kit.cli:main"

[project.urls]
Repository = "https://github.com/700799/agent-skill-eval"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_eval_kit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixtures quote task.yaml and CLI stream events verbatim; wrapping would
# stop them from being faithful copies of what users and the CLI produce.
"tests/test_task_schema.py" = ["E501"]
"tests/test_ndjson.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "anthropic.*"
follow_imports = "skip"

[tool.pytest.ini_options]
# Tests import helpers from tests.conftest, so the repo root must be on
# sys.path for a bare `pytest` too (not just `python -m pytest`).
pythonpath = ["."]
addopts = "-m 'not live' -q"
markers = [
    "live: requires an authenticated claude CLI and spends real tokens",
]
testpaths = ["tests"]
